  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #FBF9F5;
      overflow: hidden;
    }

    .iframe-container {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe
      id="app"
      src="about:blank"
      scrolling="yes"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allow="clipboard-write; clipboard-read; web-share; fullscreen; camera; microphone; display-capture; geolocation;">
    </iframe>
  </div>

  <script>
    (function () {
      var BASE = 'https://digital-culture-sulawesi-tengah.ai.studio';
      var path = window.location.pathname || '/';
      if (!path.startsWith('/') || path.startsWith('//')) {
        path = '/';
      }
      var target = BASE + path + (window.location.search || '') + (window.location.hash || '');
      var iframe = document.getElementById('app');
      if (iframe) {
        iframe.src = target;
      }
    })();
  </script>
</body>
</html>
